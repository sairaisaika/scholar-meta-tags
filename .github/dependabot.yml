# 依赖更新：每周看一次 Actions 与工具链。引擎 scholar-meta 钉在发布安装包的链接上，不在这里自动升级（升级要读它的 CHANGELOG）。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: scholar-meta
    groups:
      tooling:
        patterns: ["*"]
