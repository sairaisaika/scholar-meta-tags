name: replay

# 每周把全部断言从头重放，与最近一次导出逐字节比对；不一致就开 issue。顺带算互相认可比例异常的账号对，写进 queues。
# 再用真的浏览器打开线上页面看一眼（只读）：页面读到的是不是已发布的那份导出、模型建议是不是标着「不计票」显示出来。
on:
  schedule:
    - cron: '0 5 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 公开仓 60 天没有活动，GitHub 会停掉定时触发。每周在这里把四个定时工作流重新启用一次（已启用时是空操作）
      - name: 保活定时工作流
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for wf in intake export sample replay import; do
            gh api -X PUT "repos/${GH_REPO}/actions/workflows/${wf}.yml/enable" >/dev/null && echo "enabled ${wf}" || echo "::warning::could not re-enable ${wf}"
          done
      - run: pnpm replay
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      # 线上连不上 ⇒ 给警告、这次没看（不是通过）；看了且有一项不过 ⇒ 失败
      - name: 线上页面冒烟（真的浏览器打开已发布的站点，只读）
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm site:live
