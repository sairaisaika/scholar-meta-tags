name: sample

# 冷启动书架：按 config/seeds.json 取每个主题被引最高 N 篇 + 近两年 M 篇（在 CI 里问 OpenAlex；开发容器内外网不可达不影响）。
# 名片经 publicWorkCard 置空摘要后写 data/works/；每篇写一条模型层的主题 / 关键词建议断言；以 PR 提交让维护者看一眼。
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: smt-sample
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sample
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      # 机器人开的 PR 上，check 工作流要人批准才跑；所以开 PR 之前先在这里自检一遍，不过就不开
      - name: 自检（类型、测试、结构闸、导出读回）
        run: |
          pnpm typecheck
          pnpm test
          pnpm check
          pnpm export && pnpm check --export export/v1
      - id: pr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          branch: sample/refresh
          title: 'sample: refresh the starter shelf'
          commit-message: 'sample: refresh the starter shelf'
          body: '由 sample 工作流生成：名片快照（无摘要）与模型层建议断言。开 PR 之前已在同一次运行里过了类型、测试、结构闸与导出读回。合并前看一眼主题是否仍合适。'
          labels: sample
      # 机器人开的 PR 不会自己触发 check（那条运行没有任何作业）。手动触发是允许的：在 PR 分支上真的跑一遍，结果挂在 PR 的提交上
      - name: 在 PR 分支上触发 check
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.sha }}
        run: gh workflow run check.yml --repo "$GITHUB_REPOSITORY" --ref sample/refresh -f base="$BASE"
